version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    # main への PR は dev ブランチからのみ許可しているため (ci.yml の guard-main-pr)、
    # Dependabot の PR も dev 宛てにする
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️"
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /workers
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "⬆️"
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
